name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dependency cache keys on the committed package-lock.json, so the
      # cache is only ever restored for the exact locked tree. The Phase 1.2
      # lesson (cache: npm failing with no lockfile) is obsolete: the
      # lockfile is now generated into every scaffolded repository.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Enforce the exact npm version declared in package.json's
      # packageManager field (reproducible package-manager behavior).
      - run: corepack enable

      # Frozen install: fails if package.json and package-lock.json drift,
      # and installs exactly the locked tree - no floating resolution.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - if: ${{ failure() }}
        run: echo "Build failed for ${{ github.repository }}@${{ github.sha }}"
