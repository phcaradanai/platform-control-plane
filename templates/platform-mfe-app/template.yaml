apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: platform-mfe-app
  title: Platform MFE Application
  description: >-
    Creates a GitHub repository for a new Platform MFE Application from a
    controlled skeleton and registers it in the Software Catalog. Runtime
    module federation and deployment are added in a later phase. A curated
    set of frontend feature packs (identity, access, dashboard, settings,
    reports, history, and audit log) plus platform capabilities (notifications,
    i18n, observability) is composed into the generated application's code
    today - see docs/feature-packs.md and docs/capabilities.md.
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Application identity
      required:
        - name
        - title
        - owner
      properties:
        name:
          title: Name
          type: string
          description: Unique, URL-safe identifier for the application (used as repo name and catalog component name)
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 63
          ui:autofocus: true
        title:
          title: Title
          type: string
          description: Human-readable display name shown in the catalog and generated README
        description:
          title: Description
          type: string
          description: Short description of what the application does
          ui:widget: textarea
          ui:options:
            rows: 3
        owner:
          title: Owner
          type: string
          description: The team or group that owns this application
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Repository
      required:
        - repoUrl
        - repoVisibility
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: The GitHub repository that will be created. The default branch is always `main`.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
        repoVisibility:
          title: Repository Visibility
          type: string
          description: Whether the created GitHub repository is public or private
          enum:
            - private
            - public
          default: private
          ui:widget: radio

    - title: Application metadata
      required:
        - lifecycle
        - mode
      properties:
        lifecycle:
          title: Lifecycle
          type: string
          description: The maturity of the application
          enum:
            - experimental
            - production
          default: experimental
          ui:widget: radio
        mode:
          title: Application mode
          type: string
          description: How this application will run once runtime composition is available
          enum:
            - platform-mfe
            - standalone
            - standalone-and-mfe
          default: platform-mfe
          ui:widget: radio

    - title: Capabilities
      # Profile and permission UX consume the authentication identity context.
      # These schema rules are the App Factory validation boundary: invalid
      # combinations stop before a repository is generated.
      allOf:
        - if:
            required:
              - capabilities
            properties:
              capabilities:
                contains:
                  const: profile
          then:
            properties:
              capabilities:
                contains:
                  const: authentication
        - if:
            required:
              - capabilities
            properties:
              capabilities:
                contains:
                  const: rbac
          then:
            properties:
              capabilities:
                contains:
                  const: authentication
        - if:
            required:
              - capabilities
            properties:
              capabilities:
                contains:
                  const: audit-log
          then:
            properties:
              capabilities:
                contains:
                  const: authentication
        - if:
            required:
              - capabilities
            properties:
              capabilities:
                contains:
                  const: audit-log
          then:
            properties:
              capabilities:
                contains:
                  const: rbac
      properties:
        capabilities:
          title: Requested capabilities
          type: array
          description: >-
            Curated platform capabilities and frontend feature packs to
            request for this application. All selections are recorded in
            platform-app.json. Authentication, profile, permissions, dashboard,
            and settings compose real routes, navigation, screens, and tests;
            reports and history compose replaceable operational-data UX;
            audit-log requires authentication and permissions. Notifications,
            i18n, and observability compose platform integrations. Profile and
            permissions require authentication. The remaining selections remain
            recorded for later phases.
          items:
            type: string
            enum:
              - authentication
              - profile
              - rbac
              - dashboard
              - settings
              - reports
              - history
              - audit-log
              - notifications
              - tenant
              - theme
              - i18n
              - observability
              - desktop-ready
              - mobile-ready
          uniqueItems: true
          ui:widget: checkboxes
          default: []

  steps:
    # Renders the controlled skeleton into the working directory. Workflow
    # files are copied verbatim (copyWithoutTemplating) because their
    # `${{ ... }}` GitHub Actions expressions would otherwise be evaluated
    # as scaffolder template syntax and stripped out. copyWithoutRender is
    # the older, now-inert key on this @backstage/plugin-scaffolder-backend
    # version - the fetch:template handler only reads copyWithoutTemplating.
    # vendor/** (the @platform/ui tarball) is copied verbatim because it is
    # binary - nunjucks must never touch it.
    - id: fetchBase
      name: Fetch Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/**
          - vendor/**
        values:
          name: ${{ parameters.name }}
          title: ${{ parameters.title }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          mode: ${{ parameters.mode }}
          lifecycle: ${{ parameters.lifecycle }}
          capabilities: ${{ parameters.capabilities }}
          repo: ${{ parameters.repoUrl | parseRepoUrl }}

    # The skeleton always contains all composed capabilities' source under
    # src/capabilities/<id>/ (fetchBase rendered app.tsx/main.tsx/header.tsx
    # with nunjucks `${{ ... }}` guards that already dropped the imports for
    # anything not selected - see docs/capabilities.md). This step deletes
    # the now-unreferenced capability directories for anything not selected,
    # so the generated repository never ships dead code. This is the single
    # source of truth for which capability ids are composed (not just
    # recorded) - packages/template-validation reads this step's `each`
    # list rather than duplicating it, so the two can't drift.
    - id: pruneCapabilities
      name: Remove Unselected Capability Modules
      action: fs:delete
      each: ['notifications', 'i18n', 'observability']
      if: ${{ not (each.value in parameters.capabilities) }}
      input:
        files:
          - src/capabilities/${{ each.value }}/**

    # Feature packs use the same deterministic render-and-prune mechanism,
    # but own both a routed screen and its route entry. Removing both keeps
    # unselected packs out of generated imports, route types, and navigation.
    - id: pruneFeaturePacks
      name: Remove Unselected Feature Packs
      action: fs:delete
      each:
        [
          'authentication',
          'profile',
          'rbac',
          'dashboard',
          'settings',
          'reports',
          'history',
          'audit-log',
        ]
      if: ${{ not (each.value in parameters.capabilities) }}
      input:
        files:
          - src/feature-packs/${{ each.value }}/**
          - src/routes/${{ each.value }}.tsx

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        repoVisibility: ${{ parameters.repoVisibility }}
        defaultBranch: 'main'
        gitCommitMessage: 'Initial commit from Platform MFE Application template'

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
