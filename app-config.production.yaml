app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: http://localhost:7007

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: http://localhost:7007
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  providers:
    # `guest: null` deletes the base app-config.yaml's guest provider from
    # the merged config (Backstage's config merge treats an overriding
    # `null` as "unset this key", not "empty object") - production must
    # never allow guest sign-in. See docs/identity-and-access.md.
    guest: null
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # No `dangerouslyAllowSignInWithoutUserInCatalog` here (unlike
            # app-config.local.yaml.example's optional local testing
            # block): a GitHub sign-in only succeeds if the account's
            # username matches an existing catalog `User` entity. This is
            # the actual admin/developer access gate in production - see
            # docs/identity-and-access.md.
            - resolver: usernameMatchingUserEntityName

catalog:
  # Overrides the default list locations from app-config.yaml as these contain example data.
  # See https://backstage.io/docs/features/software-catalog/#adding-components-to-the-catalog for more details
  # on how to get entities into the catalog.
  rules:
    - allow: [Component, System, API, Resource, Location, Domain]
  locations:
    # Minimal development ownership data (Group: platform-team). Replace
    # with real org/team data before real production use - see
    # docs/catalog-model.md. File locations are relative to the backend
    # process; in a deployed context (e.g. Docker container) this is the root.
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

    # Platform control-plane's own catalog entities (Domain/System/Component)
    - type: file
      target: ./catalog-info.yaml
      rules:
        - allow: [Domain, System, Component]

    # Platform MFE Application software template
    - type: file
      target: ./templates/platform-mfe-app/template.yaml
      rules:
        - allow: [Template]
